# URL de conex�o com o MySQL.
# Altere 'db_delegacias' para o nome do seu banco de dados
spring.datasource.url=jdbc:mysql://localhost:3307/delegacias?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=usbw

# Driver de conex�o (pode ser inferido, mas � bom especificar)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------------------
# 2. CONFIGURA��O JPA (HIBERNATE)
# --------------------------------------------------------

# Tipo de dialeto para otimizar as queries SQL para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# A��o do Hibernate ao iniciar a aplica��o:
# - create: Cria as tabelas do zero (apaga dados existentes). Use com cautela!
# - update: Atualiza o esquema (adiciona ou modifica colunas) sem apagar dados. (Recomendado para desenvolvimento)
# - none: N�o faz nada. (Recomendado para produ��o)
spring.jpa.hibernate.ddl-auto=update

# Exibe as queries SQL que o Hibernate est� gerando no console (Muito �til para debug)
spring.jpa.show-sql=true

# Formata o SQL exibido para facilitar a leitura
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------------------------------
# 3. CONFIGURA��ES DO SERVIDOR EMBARCADO (TOMCAT)
# --------------------------------------------------------

# Define a porta que o aplicativo usar� (o padr�o � 8080)
server.port=8081