<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Bombeiros</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        h1 { text-align: center; color: #333; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #0056b3; }
        .error { color: red; font-size: 0.9em; margin-top: 3px; }
    </style>
</head>
<body>
<div>
    <div class="container">
        <h1>Cadastro de Bombeiros</h1>

        <form th:action="@{/bombeiros}" th:object="${bombeiros}" method="post">

            <input type="hidden" th:field="*{id}" />

            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" th:field="*{nome}" placeholder="Nome Completo do Policial" />
                <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="error">Erro no Nome</span>
            </div>

            <div>
                <label for="patente">Patente/Posto:</label>
                <input type="text" id="patente" th:field="*{patente}" placeholder="Ex: Soldado, Cabo, Delegado" />
                <span th:if="${#fields.hasErrors('patente')}" th:errors="*{patente}" class="error">Erro na Patente</span>
            </div>

            <div>
                <label for="matricula">Matrícula (Registro):</label>
                <input type="text" id="matricula" th:field="*{matricula}" placeholder="Número de Registro Único" />
                <span th:if="${#fields.hasErrors('matricula')}" th:errors="*{matricula}" class="error">Erro na Matrícula</span>
            </div>

            <div>
                <label for="bombeiro">Bombeiro (Unidade):</label>
                <select id="bombeiro" th:field="*{bombeiro}" required>
                    <option value="">-- Selecione um Corpo de Bombeiro --</option>
                    <option th:each="bom : ${bombeiro}"
                            th:value="${bom.id}"
                            th:text="${bom.nome}">
                    </option>
                </select>
                <span th:if="${#fields.hasErrors('bombeiro')}" th:errors="*{bombeiro}" class="error">Erro no Corpo de Bombeiro</span>
            </div>

            <button type="submit">Salvar Bombeiro</button>
            <a th:href="@{/bombeiros}" class="cancel-link">Cancelar</a>

        </form>
    </div>
</div>
</body>
</html>
