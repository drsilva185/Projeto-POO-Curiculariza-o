# --------------------------------------------------------
# 1. CONFIGURAÇÃO DE CONEXÃO COM O BANCO DE DADOS (MYSQL)
# --------------------------------------------------------

# URL de conexão com o MySQL.
# Altere 'db_delegacias' para o nome do seu banco de dados
spring.datasource.url=jdbc:mysql://localhost:3307/orgaos_seguranca?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=usbw

# Driver de conexão (pode ser inferido, mas é bom especificar)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------------------
# 2. CONFIGURAÇÃO JPA (HIBERNATE)
# --------------------------------------------------------

# Tipo de dialeto para otimizar as queries SQL para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Ação do Hibernate ao iniciar a aplicação:
# - create: Cria as tabelas do zero (apaga dados existentes). Use com cautela!
# - update: Atualiza o esquema (adiciona ou modifica colunas) sem apagar dados. (Recomendado para desenvolvimento)
# - none: Não faz nada. (Recomendado para produção)
spring.jpa.hibernate.ddl-auto=update

# Exibe as queries SQL que o Hibernate está gerando no console (Muito útil para debug)
spring.jpa.show-sql=true

# Formata o SQL exibido para facilitar a leitura
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------------------------------
# 3. CONFIGURAÇÕES DO SERVIDOR EMBARCADO (TOMCAT)
# --------------------------------------------------------

# Define a porta que o aplicativo usará (o padrão é 8080)
server.port=8081